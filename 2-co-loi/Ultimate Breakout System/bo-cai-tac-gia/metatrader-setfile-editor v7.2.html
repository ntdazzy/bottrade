<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metatrader Set File Editor</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0f18;
  --surface: #13161f;
  --surface2: #1a1d2e;
  --border: #252840;
  --border2: #2e3258;
  --text: #c9cdd8;
  --text-dim: #555a7a;
  --text-muted: #3a3d55;
  --accent: #7c6af7;
  --accent-dim: #2d2860;
  --gold: #f0b429;
  --gold-dim: #2a2210;
  --diff: #e05c5c;
  --diff-dim: #2a1010;
  --green: #3ecf8e;
  --green-dim: #0a2018;
  --blue: #4a9eff;
  --blue-dim: #0f1e33;
  --col-w: 180px;
  --label-w: 240px;
  --modified-bg: #1c1a0a;
  --toggle-checked-bg: #2d2a5e;
  --label-hover-bg: #14172a;
  --save-border: #1a6644;
  --cell-focus-bg: rgba(124,106,247,0.08);
  --row-hover-bg: rgba(124,106,247,0.04);
}

[data-theme="light"] {
  --bg: #f4f5fb;
  --surface: #ffffff;
  --surface2: #eceef8;
  --border: #d5d8ef;
  --border2: #bec2df;
  --text: #1a1d2e;
  --text-dim: #5a5f80;
  --text-muted: #9a9fba;
  --accent: #5a4fcf;
  --accent-dim: #edeafd;
  --gold: #8a6000;
  --gold-dim: #fff3cc;
  --diff: #b03030;
  --diff-dim: #fce8e8;
  --green: #1a7a50;
  --green-dim: #d4f5e8;
  --blue: #1a68d0;
  --blue-dim: #dbe9fc;
  --modified-bg: #fffae0;
  --toggle-checked-bg: #c5bff8;
  --label-hover-bg: #e8eaf6;
  --save-border: #0a6640;
  --cell-focus-bg: rgba(90,79,207,0.07);
  --row-hover-bg: rgba(90,79,207,0.04);
}

html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.2s, color 0.2s;
}

/* ── TABS ────────────────────────────────────────────── */
.tab-group {
  display: flex;
  align-items: stretch;
  height: 52px;
  margin-left: -16px;
}
.tab-btn {
  padding: 0 18px;
  height: 100%;
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); background: var(--surface2); }
.tab-btn.active { color: var(--green); border-bottom-color: var(--green); }
/* Onglet logo : image embarquée en base64 (fichier autonome, pas de
   dépendance réseau). Purement décoratif — aucun état hover/active/focus. */
.tab-btn { display: inline-flex; align-items: center; }
.tab-btn-logo { display: block; height: 44px; width: auto; object-fit: contain; pointer-events: none; }
.tab-btn--logo, .tab-btn--logo:hover, .tab-btn--logo.active, .tab-btn--logo:active {
  background: transparent; border: none; color: inherit; cursor: default;
}
.tab-btn--logo:focus, .tab-btn--logo:focus-visible { outline: none; box-shadow: none; }

/* ── TOPBAR ─────────────────────────────────────────── */
#topbar {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  flex: 0 0 auto;
  z-index: 200;
}

.sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; flex: 0 0 auto; }
.spacer { flex: 1 1 auto; }

.btn {
  flex: 0 0 auto;
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.12s;
  white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px;
  line-height: 1;
}
.btn-ghost { background: transparent; color: var(--text-dim); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }
.btn-accent { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.btn-accent:hover { background: var(--accent); color: #fff; }
.btn-save { background: var(--green-dim); color: var(--green); border-color: var(--save-border); }
.btn-save:hover { background: var(--green); color: #000; }
.btn-save:disabled { opacity: 0.3; cursor: not-allowed; }
/* Format = reformate le contenu du .set selon le gabarit de la dernière
   version d'UBS (ordre des paramètres, sections « ;#### »). Palette bleue
   pour se distinguer de Save et Add sans reprendre l'accent violet. */
.btn-format { background: var(--blue-dim); color: var(--blue); border-color: var(--blue); }
.btn-format:hover:not(:disabled) { background: var(--blue); color: #fff; }
.btn-format:disabled { opacity: 0.35; cursor: not-allowed; }

.badge {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
}
.badge-gold { background: var(--gold-dim); color: var(--gold); }
.badge-diff { background: var(--diff-dim); color: var(--diff); }

input[type=file] { display: none; }

/* ── TOOLBAR (search + batch edit fusionnés) ──────────
   flex-wrap:wrap : sur écran étroit la ligne se replie sans déborder. */
#toolbar {
  min-height: 50px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 4px 12px;
  flex: 0 0 auto;
}

#search {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 12px;
  width: 200px;
  flex: 0 0 auto;
  height: 26px;
}
#search:focus { outline: none; border-color: var(--accent); }

.toggle-btn {
  flex: 0 0 auto;
  height: 26px;
  padding: 0 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.12s;
  line-height: 24px;
  text-align: center;
  width: 160px;
  white-space: nowrap;
}
.toggle-btn.active {
  background: var(--diff-dim);
  color: var(--diff);
  border-color: var(--diff);
}
/* Compteur intégré au bouton "Show differences only (N)". */
#diff-btn #diff-count { margin-left: 4px; font-weight: 600; }

.btn-fold {
  flex: 0 0 auto;
  height: 26px;
  padding: 0 12px;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: var(--accent-dim);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.12s;
  white-space: nowrap;
  line-height: 1;
}
.btn-fold:hover { background: var(--accent); color: #fff; }

/* Batch edit — désormais intégré dans #toolbar (plus de barre dédiée).
   Label sur 2 lignes (BATCH / EDIT) pour rester compact horizontalement. */
#batch-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  white-space: nowrap;
  line-height: 1.15;
  text-align: center;
}
.batch-input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 12px;
  font-family: inherit;
  height: 28px;
  flex: 0 0 auto;
}
.batch-input:focus { outline: none; border-color: var(--accent); }
#batch-param      { width: 180px; }
#batch-value      { width: 120px; }
#batch-value-bool { width: 120px; display: none; appearance: none; cursor: pointer; }
/* Menu déroulant pour les paramètres à choix limité (Run_Strategy, Risk,
   timeframes, RNG_*, etc.). Plus large parce que les libellés peuvent
   être longs (« Beyond opposite side of range »). */
#batch-value-enum { width: 220px; display: none; appearance: none; cursor: pointer; }

.btn-patch { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.btn-patch:hover { background: var(--accent); color: #fff; }

.dryrun-wrap {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--text-dim);
  cursor: pointer; user-select: none; margin-left: 4px;
}
.dryrun-wrap input { cursor: pointer; accent-color: var(--accent); }

/* ── DROP ZONE ───────────────────────────────────────── */
#dropzone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1 1 0;
  min-height: 0;
  gap: 14px;
  color: var(--text-dim);
}
#dropzone.drag-over { background: var(--accent-dim); }
#dropzone svg { opacity: 0.3; }
#dropzone h2 { font-size: 18px; font-weight: 600; color: var(--text); margin: 0; }
#dropzone p  { font-size: 13px; margin: 0; }

/* ── TABLE WRAPPER ───────────────────────────────────── */
/* flex:1 + min-height/width:0 : le wrapper occupe la hauteur restante
   dans body (flex column) et autorise ses scrollbars internes. */
#table-wrap {
  display: none;
  overflow-x: auto;
  overflow-y: auto;
  width: 100%;
  min-width: 0;
  min-height: 0;
  flex: 1 1 0;
}

table {
  border-collapse: collapse;
  min-width: 100%;
  font-size: 12px;
}

/* ── HEADER ROW ──────────────────────────────────────── */
thead tr {
  position: sticky;
  top: 0;
  z-index: 100;
}

thead th {
  background: var(--surface);
  border-bottom: 2px solid var(--border2);
  border-right: 1px solid var(--border);
  padding: 0;
  white-space: nowrap;
  vertical-align: bottom;
}

thead th:first-child {
  position: sticky;
  left: 0;
  z-index: 101;
  width: var(--label-w);
  min-width: var(--label-w);
}

.th-inner {
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: stretch;
}

.th-filename {
  font-weight: 700;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  border-radius: 4px;
  padding: 1px 4px;
  margin: -1px -4px;
}
.th-filename:hover { background: var(--surface2); }

.th-filename-input {
  font-weight: 700;
  color: var(--text);
  background: var(--surface2);
  border: 1px solid var(--accent);
  border-radius: 4px;
  padding: 3px 6px;
  font-size: 12px;
  line-height: 1.4;
  height: calc(1.4em * 3 + 6px);
  width: 100%;
  outline: none;
  font-family: inherit;
  resize: none;
  display: block;
  overflow: hidden;
  word-break: break-all;
  box-sizing: border-box;
}

.th-actions {
  display: flex;
  gap: 5px;
  align-items: center;
}

.btn-tiny {
  flex: 0 0 auto;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 10px;
  font-weight: 600;
  transition: all 0.1s;
  line-height: 1;
}
.btn-tiny-save { background: var(--green-dim); color: var(--green); border-color: var(--save-border); }
.btn-tiny-save:hover { background: var(--green); color: #000; }
.btn-tiny-remove { background: transparent; color: var(--text-dim); border-color: var(--border); }
.btn-tiny-remove:hover { background: var(--diff-dim); color: var(--diff); border-color: var(--diff); }
.btn-tiny-format { background: var(--blue-dim); color: var(--blue); border-color: var(--blue); }
.btn-tiny-format:hover:not(:disabled) { background: var(--blue); color: #fff; }
.btn-tiny-format:disabled { opacity: 0.35; cursor: not-allowed; }

.th-change-count { font-size: 10px; color: var(--gold); }

/* ── SECTION ROWS ────────────────────────────────────── */
tr.section-row {
  cursor: pointer;
  user-select: none;
}
/* v7.0 : titre enveloppé dans <span class="section-inner"> par buildBody().
   C'est ce span qui porte position:sticky, PAS le td. Sticky sur un td
   colspan-toutes-colonnes ne s'active jamais (le td est déjà toujours
   visible → aucun ré-ancrage) et le titre suivait le scroll horizontal.
   Sur un span inline-block de largeur limitée à son contenu, sticky
   fonctionne. Le td garde son fond violet, ses bordures et son padding
   vertical ; padding horizontal et icône ▾ migrent dans le span. */
tr.section-row td {
  background: var(--surface2);
  border-top: 2px solid var(--border2);
  border-bottom: 1px solid var(--border2);
  padding: 6px 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}
tr.section-row .section-inner {
  position: sticky; left: 0; z-index: 10;
  display: inline-block; padding: 0 14px;
}
tr.section-row .section-inner::before {
  content: '▾';
  display: inline-block;
  margin-right: 7px;
  font-size: 11px;
  opacity: 0.6;
  transition: transform 0.15s;
}
tr.section-row.collapsed .section-inner::before {
  transform: rotate(-90deg);
}
tr.section-row:hover td { background: var(--label-hover-bg); }

/* Breaker : bandeau plein-largeur inséré ENTRE deux paramètres pour
   matérialiser une sous-section (typiquement les jours de la semaine
   dans « Trading hours »). Non cliquable, pas d'icône ▾, hauteur
   réduite ; teinte bleue atténuée. Même refactor sticky-inner que
   .section-row. */
tr.breaker-row td {
  background: var(--blue-dim);
  color: var(--blue);
  border-top: 1px solid var(--blue);
  border-bottom: 1px solid var(--blue);
  padding: 3px 0; font-size: 10px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  opacity: 0.55; user-select: none;
}
tr.breaker-row .breaker-inner {
  position: sticky; left: 0; z-index: 10;
  display: inline-block; padding: 0 14px;
}
tr.breaker-row.section-collapsed { display: none; }

/* ── PARAM ROWS ──────────────────────────────────────── */
tr.param-row {
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
tr.param-row:hover { background: var(--row-hover-bg); }
tr.param-row.hidden        { display: none; }
tr.section-row.hidden      { display: none; }
tr.breaker-row.hidden      { display: none; }
tr.param-row.section-hidden { display: none; }
tr.breaker-row.section-hidden { display: none; }

/* Smooth accordion animation.
   grid-template-rows drives content collapse; max-height forces the table
   cell height to actually collapse (table layout ignores overflow:hidden). */
.row-anim {
  display: grid;
  grid-template-rows: 1fr;
  overflow: hidden;
  max-height: 80px;
  opacity: 1;
  transition: grid-template-rows 0.25s ease, max-height 0.25s ease, opacity 0.22s ease;
}
.row-anim-inner { min-height: 0; }
tr.section-collapsed { border-bottom: none; }
tr.section-collapsed .row-anim { grid-template-rows: 0fr; max-height: 0; opacity: 0; }
.no-anim .row-anim { transition: none; }

tr.param-row td {
  border-right: 1px solid var(--border);
  padding: 0;
  vertical-align: middle;
}

td.label-cell {
  position: sticky;
  left: 0;
  z-index: 10;
  background: var(--surface);
  width: var(--label-w);
  min-width: var(--label-w);
  padding: 0;
  border-right: 2px solid var(--border2);
}
td.label-cell .row-anim-inner { padding: 6px 12px; }
tr.param-row:hover td.label-cell { background: var(--label-hover-bg); }

.param-name {
  font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
  color: var(--text-dim);
  word-break: break-word;
  line-height: 1.4;
}
.param-name.opt { color: var(--gold); }

.param-range {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
  font-family: monospace;
}

/* ── VALUE CELLS ─────────────────────────────────────── */
td.value-cell {
  width: var(--col-w);
  min-width: var(--col-w);
  max-width: var(--col-w);
  background: var(--bg);
  position: relative;
}

td.value-cell.diff-cell { background: var(--diff-dim); }
td.value-cell.modified-cell { background: var(--modified-bg); }

.cell-input {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  color: var(--text);
  padding: 7px 10px;
  font-size: 12px;
  font-family: 'SF Mono', 'JetBrains Mono', monospace;
  outline: none;
}
.cell-input:focus {
  background: var(--cell-focus-bg);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.cell-input.modified { color: var(--gold); }
td.diff-cell .cell-input { color: var(--diff); }

/* Cellule Comment : input rétréci + petit bouton « ↦ » pour renommer
   le fichier avec la valeur du commentaire courant. */
.cell-with-rename { display: flex; align-items: stretch; height: 100%; }
.cell-with-rename .cell-input { flex: 1 1 auto; min-width: 0; }
.btn-rename-to-comment {
  flex: 0 0 auto; padding: 0 8px;
  background: var(--surface2); color: var(--text-dim);
  border: none; border-left: 1px solid var(--border);
  cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-rename-to-comment:hover { background: var(--accent); color: #000; }
.btn-rename-to-comment svg { display: block; }

/* v7.0 : bouton « ⇉ » présent sur toutes les cellules éditables (texte,
   select enum, toggle boolean) SAUF Comment (déjà occupée par ↦).
   Recopie la valeur courante vers tous les autres fichiers chargés
   pour la même clé — rend le batch edit inutile pour aligner une
   valeur sur tout un portefeuille. Même look que .btn-rename-to-comment.
   Rendu conditionnellement : jamais affiché quand un seul fichier
   est chargé (sinon aucun effet). */
.cell-with-actions { display: flex; align-items: stretch; height: 100%; }
.cell-with-actions > .cell-input,
.cell-with-actions > .cell-select,
.cell-with-actions > .cell-toggle { flex: 1 1 auto; min-width: 0; }
.btn-apply-all {
  flex: 0 0 auto; padding: 0 8px;
  background: var(--surface2); color: var(--text-dim);
  border: none; border-left: 1px solid var(--border);
  cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-apply-all:hover { background: var(--accent); color: #fff; }
.btn-apply-all svg { display: block; }

/* v7.0 : rendu <select> pour les paramètres à choix limités. Même
   look que .cell-input (fond transparent, mono), avec une petite
   flèche « v » dessinée en pur CSS. */
.cell-select {
  width: 100%; height: 100%;
  background: transparent; border: none; color: var(--text);
  padding: 7px 22px 7px 10px; font-size: 12px;
  font-family: 'SF Mono','JetBrains Mono',monospace; outline: none;
  cursor: pointer;
  appearance: none; -webkit-appearance: none; -moz-appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, currentColor 50%),
    linear-gradient(-45deg, transparent 50%, currentColor 50%);
  background-position:
    calc(100% - 12px) calc(50% + 1px),
    calc(100% - 8px) calc(50% + 1px);
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
  opacity: 0.85;
}
.cell-select:focus { background-color: var(--cell-focus-bg); box-shadow: inset 0 0 0 1px var(--accent); opacity: 1; }
.cell-select.modified { color: var(--gold); }
td.diff-cell .cell-select { color: var(--diff); }
.cell-select option { background: var(--surface); color: var(--text); }

/* Toggle in cell */
.cell-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 10px;
  height: 100%;
  cursor: pointer;
}
.toggle {
  position: relative; width: 32px; height: 18px; flex-shrink: 0;
}
.toggle input { opacity: 0; position: absolute; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: var(--border2);
  border-radius: 18px;
  cursor: pointer;
  transition: 0.15s;
}
.toggle-slider:before {
  content: '';
  position: absolute;
  width: 12px; height: 12px;
  left: 3px; top: 3px;
  background: var(--text-dim);
  border-radius: 50%;
  transition: 0.15s;
}
.toggle input:checked + .toggle-slider { background: var(--toggle-checked-bg); }
.toggle input:checked + .toggle-slider:before {
  transform: translateX(14px);
  background: var(--accent);
}
td.diff-cell .toggle input:checked + .toggle-slider { background: var(--diff-dim); }
td.diff-cell .toggle input:checked + .toggle-slider:before { background: var(--diff); }
.toggle-val {
  font-size: 11px;
  font-family: monospace;
  color: var(--text-dim);
  min-width: 32px;
}
td.diff-cell .toggle-val { color: var(--diff); }

/* ── EMPTY STATE ─────────────────────────────────────── */
#no-diff {
  display: none;
  text-align: center;
  padding: 60px;
  color: var(--text-dim);
  font-size: 14px;
}

/* ── RECAP PANEL ─────────────────────────────────────── */
/* En flex column, plus besoin de position:sticky : le panel reste
   en place naturellement entre la toolbar et #table-wrap. */
#recap-panel {
  display: none;
  background: var(--surface);
  border-bottom: 2px solid var(--border2);
  max-height: 190px;
  overflow-y: auto;
  flex: 0 0 auto;
}

#recap-header {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 1;
}

#recap-summary { font-size: 12px; font-weight: 600; flex: 1 1 auto; }
#recap-summary.ok   { color: var(--green); }
#recap-summary.warn { color: var(--text-dim); }
#recap-summary.dry  { color: var(--accent); }

.btn-undo {
  background: var(--gold-dim); color: var(--gold);
  border: 1px solid var(--gold); border-radius: 4px;
  padding: 2px 10px; font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all 0.12s; display: none;
}
.btn-undo:hover { background: var(--gold); color: #000; }

.recap-close {
  background: transparent; border: none;
  color: var(--text-muted); cursor: pointer;
  font-size: 16px; line-height: 1; padding: 0 2px;
}
.recap-close:hover { color: var(--text); }

.recap-row {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 5px 16px;
  font-size: 11px;
  border-bottom: 1px solid var(--border);
}
.recap-row:last-child { border-bottom: none; }
.recap-row.modified { background: rgba(240,180,41,0.04); }
.recap-row.skipped  { opacity: 0.55; }

.rr-icon { text-align: center; font-size: 12px; }
.rr-file { font-family: 'SF Mono','JetBrains Mono',monospace; color: var(--text);
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rr-change { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.rr-old  { color: var(--text-dim); font-family: monospace; }
.rr-arr  { color: var(--text-muted); }
.rr-new  { color: var(--gold); font-family: monospace; font-weight: 600; }
.rr-skip { color: var(--text-muted); font-style: italic; }

</style>
</head>

<script>
// ── STATE ────────────────────────────────────────────────
const files = [];      // { id, name, buffer, parsedLines, paramMap, reformatted }
const loadingNames = new Set(); // track files currently being read
const collapsedSections = new Set(); // keys of collapsed sections
let diffOnly = false;
let totalChanges = 0;

// ── HELPERS ──────────────────────────────────────────────
// On ne travaille qu'avec des .set, l'extension est donc masquée dans
// l'UI (span cliquable + textarea de rename). Réattachée dans
// commitRename() avant stockage — file.name reste TOUJOURS suffixé.
function stripSetExt(name) {
  return name.replace(/\.set$/i, '');
}

// Détecte la ligne « Comment » (Comment, OrderComment, TradeComment…).
function isCommentKey(key) {
  return /comment/i.test(key || '');
}

// ── ENUM DEFINITIONS ─────────────────────────────────────
// v7.0 : paramètres à choix limités — rendus en <select> plutôt qu'en
// champ texte. Valeurs = celles écrites dans le .set (codes MQL5 pour
// les timeframes, indices 0-N pour les listes maison). Libellés = ceux
// affichés par MetaTrader dans l'onglet Inputs.
const TIMEFRAME_ENUM = {
  '0'    : 'current',
  '1'    : '1 Minute',    '2'  : '2 Minutes',  '3'  : '3 Minutes',  '4'  : '4 Minutes',
  '5'    : '5 Minutes',   '6'  : '6 Minutes',  '10' : '10 Minutes', '12' : '12 Minutes',
  '15'   : '15 Minutes',  '20' : '20 Minutes', '30' : '30 Minutes',
  '16385': '1 Hour',      '16386': '2 Hours',  '16387': '3 Hours',  '16388': '4 Hours',
  '16390': '6 Hours',     '16392': '8 Hours',  '16396': '12 Hours',
  '16408': '1 Day',       '32769': '1 Week',   '49153': '1 Month',
};

const TIMEFRAME_KEYS = new Set([
  'ATR_Timeframe', 'VolTimeframe', 'VolAtrTimeframe', 'Entry_Timing',
  'ST1_Timeframe', 'RNG_Timeframe', 'RNG_ATR_Timeframe',
  'Exit_Timing', 'Exit_HL_trailingSL_timeframe',
  'GridTiming',
  'confirmationCandleTimeframeA', 'confirmationCandleTimeframeB',
  'confirmationCandleTimeframeC', 'confirmationCandleTimeframeD',
  'confirmationCandleTimeframeE',
]);

const PARAM_ENUMS = {
  Run_Strategy: {
    '1': 'Breakout Support/Resistance',
    '2': 'Volatility Breakout',
    '3': 'Range Breakout',
  },
  // Valeurs réelles observées dans les .set sauvegardés par MT5 le 2026-09-19.
  // UBS utilise des constantes numériques arbitraires (pas 0..4) — écrire
  // Risk=1..4 laisse MT5 blanchir le champ à la lecture.
  Risk: {
    '0': 'Manual Lotsize',
    '9999': 'Lots per balance',
    '999': 'use Risk Per Trade (%)',
    '5555': 'use Risk per trade in $/€',
    '123': 'use Max Risk Per Strategy',
  },
  useVirtualStops: {
    '0': 'OFF',
    '1': 'STANDARD',
    '2': 'ALL EXCEPT BE',
  },
  EntryModel: {
    '1': 'entry at breakout',
    '2': 'entry at retest after breakout',
  },
  Time_Source: {
    '0': 'GMT-0',
    '1': 'Computer / VPS',
    '2': 'Broker',
  },
  Exit_MagicTrail_Mode: {
    '0': 'OFF',
    '1': 'Full',
    '2': 'Breakeven only',
  },
  // Valeurs réelles observées dans les .set MT5 le 2026-09-19 : 1..4 (pas 0..3).
  BacktestSpeed: {
    '1': 'normal',
    '2': 'efficient',
    '3': 'fast',
    '4': 'ultra fast',
  },
  RNG_MeasureMode: {
    '1': 'High/Low (wicks)',
    '2': 'Open/Close (bodies)',
  },
  RNG_BreakConfirm: {
    '1': 'Candle close beyond edge',
    '2': 'Wick through edge is enough',
  },
  // UBS attend 1..3 (pas 0..2) — un fichier à 0 s'affichait vide et
  // chaque option était décalée d'un cran à l'écriture.
  RNG_TimeZone: {
    '1': 'Broker server time',
    '2': 'New York (US DST)',
    '3': 'London (EU DST)',
  },
  RNG_EntryMode: {
    '1': 'Pending stop at range edge',
    '2': 'Market on candle close',
  },
  RNG_SL_Mode: {
    '1': 'Standard initial SL',
    '2': 'Beyond opposite side of range',
  },
};

function paramEnumFor(key) {
  if (Object.prototype.hasOwnProperty.call(PARAM_ENUMS, key)) return PARAM_ENUMS[key];
  if (TIMEFRAME_KEYS.has(key)) return TIMEFRAME_ENUM;
  return null;
}

// Bornes réelles observées dans les fichiers .set sauvegardés par MT5 pour
// les paramètres énumérés d'UBS. Utilisées quand on écrit un fichier dont
// le format d'origine était compact (loaded en type: 'simple') : on
// rebascule en format « test settings » avec ces bornes pour que MT5
// reconnaisse la valeur comme une option d'enum valide plutôt que la
// blanchir silencieusement. Bug reproduit avec Risk le 2026-09-19 :
// Risk=4 compact refusé, Risk=4||4||0||20||N accepté.
const PARAM_ENUM_MT5_MAX = {
  Risk: 20,
  useVirtualStops: 3,
  BacktestSpeed: 4,
  RNG_TimeZone: 3,
  Run_Strategy: 2,
  EntryModel: 2,
  Time_Source: 2,
  Exit_MagicTrail_Mode: 2,
  RNG_MeasureMode: 2,
  RNG_BreakConfirm: 2,

// ── FILE LOADING ─────────────────────────────────────────
function addFiles(input) {
  const incoming = Array.from(input.files);
  input.value = '';
  if (incoming.length === 0) return;

  const list = incoming.filter(f => f.name.toLowerCase().endsWith('.set')).filter(f =>
    !files.some(e => e && e.name === f.name) && !loadingNames.has(f.name)
  );
  if (list.length === 0) return;
  list.forEach(f => loadingNames.add(f.name));
  let pending = list.length;
  const startIndex = files.length;
  // Pre-allocate slots to preserve selection order
  list.forEach((_, i) => files.push(null));
  list.forEach((file, i) => {
    const reader = new FileReader();
    reader.onload = e => {
      const buffer   = e.target.result;
      const decoded  = decodeBuffer(buffer);
      const parsed   = parseSetFile(decoded);
      const paramMap = buildParamMap(parsed);
      files[startIndex + i] = { id: `f${Date.now()}_${Math.random()}`, name: file.name, buffer, parsed, paramMap, changes: new Set() };
      loadingNames.delete(file.name);
      pending--;
      if (pending === 0) rebuildAll();
    };
    reader.readAsArrayBuffer(file);
  });
}

function decodeBuffer(buf) {
  const b = new Uint8Array(buf);
  if (b[0] === 0xFF && b[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
  if (b[0] === 0xFE && b[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  return new TextDecoder('utf-8').decode(buf);
}

// ── PARSING ──────────────────────────────────────────────
function parseSetFile(text) {
  return text.split(/\r?\n/).map((raw, idx) => {
    const line = raw.trim();
    if (!line) return { type: 'empty', raw, idx };
    if (line.startsWith(';')) {
      // v7.0 : les fichiers .set générés par UBS 7.6+ utilisent des en-têtes
      // de section « ;######## Title ######## » au lieu de l'ancien
      // « SectionKey=------ Title ------ ». On les reconnaît par leur
      // décoration en # et on les remonte au type « section » comme leurs
      // homologues legacy — même clé stable = même comportement d'accordéon.
      const m = line.slice(1).match(/^\s*#{2,}\s*(.+?)\s*#{2,}\s*$/);
      if (m) {
        const title = m[1];
        return { type: 'section', raw, idx, key: 'sec:' + title, title };
      }
      return { type: 'comment', raw, idx };
    }

    const eq = line.indexOf('=');
    if (eq === -1) return { type: 'unknown', raw, idx };

    const key = line.slice(0, eq).trim();
    const rest = line.slice(eq + 1);

    if (rest.includes('||')) {
      const [value, def, mn, mx, flag] = rest.split('||');
      if (value.trim().startsWith('---')) {
        return { type: 'section', raw, idx, key, title: extractTitle(value) };
      }
      const isBoolean = (value === 'true' || value === 'false') && mn === '0' && mx === 'true';
      return { type: 'param', raw, idx, key, value, def, mn, mx, opt: (flag||'').trim().toUpperCase() === 'Y', isBoolean };
    }

    if (rest.trim().startsWith('---')) {
      return { type: 'section', raw, idx, key, title: extractTitle(rest) };
    }

    // v7.0 : lignes « breakerX=######### » utilisées par UBS 7.x comme
    // séparateurs visuels DANS une section. Bande colorée pleine largeur,
    // non cliquable, sans champ.
    if (/^#{2,}$/.test(rest.trim())) {
      return { type: 'breaker', raw, idx, key };
    }

    // v7.0 : détecter les booléens aussi sur le format compact (Load→Save
    // d'UBS 7.6 supprime les métadonnées « ||default||min||max||flag »).
    const trimmedVal = rest.trim();
    const isBoolean  = trimmedVal === 'true' || trimmedVal === 'false';
    return { type: 'simple', raw, idx, key, value: rest, isBoolean };
  });
}

function extractTitle(s) {
  return s.trim().replace(/^-+\s*/, '').replace(/\s*-+$/, '').trim();
}


function buildParamMap(parsed) {
  const map = {};
  parsed.forEach(l => {
    if ((l.type === 'param' || l.type === 'simple') && !(l.key in map))
      map[l.key] = l;   // keep first occurrence only
  });
  return map;
}

// ── UNIFIED ROW ORDER ─────────────────────────────────────
function buildUnifiedRows() {
  const seen = new Set();
  const rows = [];

  for (const file of files) {
    for (const line of file.parsed) {
      if (line.type === 'section') {
        const id = 's:' + line.key;
        if (!seen.has(id)) { seen.add(id); rows.push({ ...line }); }
      } else if (line.type === 'breaker') {
        const id = 'b:' + line.key;
        if (!seen.has(id)) { seen.add(id); rows.push({ ...line }); }
      } else if (line.type === 'param' || line.type === 'simple') {
        if (!seen.has(line.key)) { seen.add(line.key); rows.push({ ...line }); }
      }
    }
  }
  return rows;
}

// ── SECTION ACCORDION ────────────────────────────────────
function toggleSection(sectionTr, key) {
  const collapsing = !collapsedSections.has(key);
  if (collapsing) collapsedSections.add(key);
  else            collapsedSections.delete(key);

  sectionTr.classList.toggle('collapsed', collapsing);

  const rows = [];
  let next = sectionTr.nextElementSibling;
  while (next && !next.classList.contains('section-row')) {
    rows.push(next);
    next = next.nextElementSibling;
  }

  // toggle section-collapsed: CSS handles the 0fr↔1fr animation on .row-anim
  rows.forEach(tr => tr.classList.toggle('section-collapsed', collapsing));
  updateFoldAllBtn();
}

function applySectionCollapse() {
  if (collapsedSections.size === 0) return;
  // Disable transitions so the restore after rebuild is instant, not animated
  document.body.classList.add('no-anim');
  document.querySelectorAll('tr.section-row').forEach(sectionTr => {
    const key = sectionTr.dataset.section;
    if (!collapsedSections.has(key)) return;
    sectionTr.classList.add('collapsed');
    let next = sectionTr.nextElementSibling;
    while (next && !next.classList.contains('section-row')) {
      next.classList.add('section-collapsed');
      next = next.nextElementSibling;
    }
  });
  // Remove no-anim after one frame so future toggles animate normally
  requestAnimationFrame(() => {
    document.body.classList.remove('no-anim');
    updateFoldAllBtn();
  });
}

function toggleAllSections() {
  const allRows = document.querySelectorAll('tr.section-row');
  const allCollapsed = allRows.length > 0 &&
    [...allRows].every(tr => collapsedSections.has(tr.dataset.section));

  allRows.forEach(sectionTr => {
    const key = sectionTr.dataset.section;
    if (allCollapsed) {
      collapsedSections.delete(key);
      sectionTr.classList.remove('collapsed');
    } else {
      collapsedSections.add(key);
      sectionTr.classList.add('collapsed');
    }
    let next = sectionTr.nextElementSibling;
    while (next && !next.classList.contains('section-row')) {
      next.classList.toggle('section-collapsed', !allCollapsed);
      next = next.nextElementSibling;
    }
  });

  updateFoldAllBtn();
}

function updateFoldAllBtn() {
  const btn = document.getElementById('fold-all-btn');
  if (!btn) return;
  const allRows = document.querySelectorAll('tr.section-row');
  const allCollapsed = allRows.length > 0 &&
    [...allRows].every(tr => collapsedSections.has(tr.dataset.section));
  btn.textContent = allCollapsed ? '▾ Unfold all' : '▸ Fold all';
}

// ── PERSIST EDITS ACROSS REBUILDS ────────────────────────
// Write current DOM input values back into paramMap so rebuildAll()
// restores them when it recreates the table.
function flushDomToState() {
  files.forEach(file => {
    Object.keys(file.paramMap).forEach(key => {
      const inp = document.getElementById(`inp_${file.id}_${key}`);
      if (!inp) return;
      file.paramMap[key].value = inp.type === 'checkbox'
        ? (inp.checked ? 'true' : 'false')
        : inp.value;
    });
  });
}

// Re-apply modified styling after the DOM is recreated.
function restoreModifiedVisuals() {
  files.forEach(file => {
    file.changes.forEach(key => {
      const inp = document.getElementById(`inp_${file.id}_${key}`);
      if (!inp) return;
      inp.classList.add('modified');
      const td = inp.closest('td');
      if (td) { td.classList.remove('diff-cell'); td.classList.add('modified-cell'); }
    });
    if (file.changes.size > 0) {
      const cc = document.getElementById(`cc_${file.id}`);
      if (cc) {
        cc.textContent = `${file.changes.size} change${file.changes.size !== 1 ? 's' : ''}`;
        cc.style.display = 'inline';
      }
    }
  });
  updateChangesBadge();
}

// ── REBUILD ───────────────────────────────────────────────
function rebuildAll() {
  // Remove any null slots (shouldn't happen after all readers complete, but safety)
  const nulls = files.indexOf(null);
  if (nulls !== -1) return; // still loading, wait for all to finish
  if (files.length === 0) return;

  flushDomToState();

  document.getElementById('dropzone').style.display = 'none';
  document.getElementById('table-wrap').style.display = 'block';
  document.getElementById('toolbar').style.display = 'flex';
  document.getElementById('save-all-btn').disabled = false;
  document.getElementById('reset-btn').style.display = 'inline-flex';
  // Format all reste actif tant qu'au moins un fichier chargé n'a pas
  // été reformaté — cliquer dessus quand tout est déjà à jour n'aurait
  // aucun effet visible.
  const anyFormattable = files.some(f => f && !f.reformatted);
  const formatAllBtn = document.getElementById('format-all-btn');
  formatAllBtn.disabled = !anyFormattable;
  formatAllBtn.title = anyFormattable
    ? `Reformats every loaded .set to the latest ${UBS_TEMPLATE_LABEL} layout: same parameter order, same « ;#### » section headers, missing new parameters filled with UBS defaults. Your existing values are kept — only the shape of the file changes. Save each file to persist.`
    : `All loaded files are already reformatted to ${UBS_TEMPLATE_LABEL}. Reload a file to format it again.`;

  buildHeader();
  buildBody();
  applySectionCollapse();
  restoreModifiedVisuals();
  applyFilters();
  updateParamDatalist();
}

function buildHeader() {
  const tr = document.getElementById('table-head').querySelector('tr');
  // Remove old file columns
  while (tr.children.length > 1) tr.removeChild(tr.lastChild);

  files.forEach((file, fi) => {
    const th = document.createElement('th');
    th.id = `th_${file.id}`;
    // Format déjà appliqué → bouton grisé (tooltip explicite). Recliquer
    // dessus ré-écraserait de subtils choix de l'utilisateur ; mieux vaut
    // le désactiver et forcer un rechargement du fichier d'origine pour
    // reformater à nouveau.
    const formatBtnAttrs = file.reformatted
      ? `disabled title="Already reformatted to ${UBS_TEMPLATE_LABEL}. Reload the file to format again."`
      : `title="Reformats this .set to the ${UBS_TEMPLATE_LABEL} layout: same parameter order, same « ;#### » section headers, new UBS parameters filled with defaults. Existing values are kept."`;
    th.innerHTML = `<div class="th-inner">
      <span class="th-filename" id="fn_${file.id}" title="Click to rename" onclick="startRename('${file.id}')">${stripSetExt(file.name)}</span>
      <div class="th-actions">
        <button class="btn-tiny btn-tiny-save" onclick="saveFile('${file.id}')">Save .set</button>
        <button class="btn-tiny btn-tiny-format" onclick="formatFileToLatestUBS('${file.id}')" ${formatBtnAttrs}>Format ${UBS_TEMPLATE_LABEL}</button>
        <button class="btn-tiny btn-tiny-remove" onclick="removeFile('${file.id}')">✕</button>
        <span class="th-change-count" id="cc_${file.id}" style="display:none"></span>
      </div>
    </div>`;
    tr.appendChild(th);
  });
}

function buildBody() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  const rows = buildUnifiedRows();

  rows.forEach(row => {
    if (row.type === 'section') {
      const tr = document.createElement('tr');
      tr.className = 'section-row';
      tr.dataset.section = row.key;
      tr.onclick = () => toggleSection(tr, row.key);
      const td = document.createElement('td');
      td.colSpan = files.length + 1;
      // Titre dans un span interne pour permettre position:sticky (cf. CSS).
      const inner = document.createElement('span');
      inner.className = 'section-inner';
      inner.textContent = row.title || row.key;
      td.appendChild(inner);
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    // v7.0 : ligne séparatrice « breakerX=### » — bandeau plein-largeur teinté,
    // non cliquable, sans champ. Nom de la clé affiché en discret pour référence.
    if (row.type === 'breaker') {
      const tr = document.createElement('tr');
      tr.className = 'breaker-row';
      tr.dataset.key = row.key.toLowerCase();
      const td = document.createElement('td');
      td.colSpan = files.length + 1;
      const inner = document.createElement('span');
      inner.className = 'breaker-inner';
      inner.textContent = row.key;
      td.appendChild(inner);
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    if (row.type !== 'param' && row.type !== 'simple') return;

    const tr = document.createElement('tr');
    tr.className = 'param-row';
    tr.dataset.key = row.key.toLowerCase();
    tr.id = `row_${row.key}`;

    // Label cell
    const labelTd = document.createElement('td');
    labelTd.className = 'label-cell';
    const anyOpt = files.some(f => f.paramMap[row.key]?.opt);
    let labelHtml = `<div class="param-name${anyOpt ? ' opt' : ''}">${row.key}</div>`;
    const firstWithMeta = files.find(f => f.paramMap[row.key]?.mn !== undefined);
    if (firstWithMeta) {
      const p = firstWithMeta.paramMap[row.key];
      if (p.mn && p.mx && !(p.mn === '0' && p.mx === 'true')) {
        labelHtml += `<div class="param-range">${p.mn} – ${p.mx}</div>`;
      }
    }
    labelTd.innerHTML = `<div class="row-anim"><div class="row-anim-inner">${labelHtml}</div></div>`;
    tr.appendChild(labelTd);

    // Value cells
    files.forEach((file, fi) => {
      const td = document.createElement('td');
      td.className = 'value-cell';
      td.dataset.fileId = file.id;
      td.dataset.key = row.key;

      const paramLine = file.paramMap[row.key];
      const value = paramLine ? paramLine.value : (row.virtual ? row.virtualDefault : '');
      const isBoolean = paramLine?.isBoolean ?? false;
      const enumDef = paramEnumFor(row.key);

      // v7.0 : bouton ⇉ recopie la valeur vers tous les autres fichiers.
      // Non ajouté sur Comment (déjà occupé par ↦ avec un rôle différent —
      // recopier un Comment sur tous les fichiers casserait l'identité
      // magic/comment de chaque stratégie).
      const applyBtn = isCommentKey(row.key) ? '' : applyAllBtnHtml(file.id, row.key);

      let cellHtml;
      if (enumDef) {
        // Paramètre à choix limité — rendu en <select>. La valeur écrite
        // dans le .set reste le code numérique de MQL5, seul l'affichage
        // est traduit en libellé lisible (« 1 Day » plutôt que « 16408 »).
        const currentValStr = String(value).trim();
        const options = Object.entries(enumDef).map(([v, label]) => {
          const selected = currentValStr === v ? ' selected' : '';
          return `<option value="${escHtml(v)}"${selected}>${escHtml(label)}</option>`;
        }).join('');
        const isKnown = Object.prototype.hasOwnProperty.call(enumDef, currentValStr);
        const fallbackOpt = (!isKnown && currentValStr !== '')
          ? `<option value="${escHtml(currentValStr)}" selected>${escHtml(currentValStr)} (custom)</option>`
          : '';
        const selectHtml = `<select class="cell-select" id="inp_${file.id}_${row.key}" onchange="onCellChange('${file.id}','${row.key}',this)">${fallbackOpt}${options}</select>`;
        cellHtml = applyBtn
          ? `<div class="cell-with-actions">${selectHtml}${applyBtn}</div>`
          : selectHtml;
      } else if (isBoolean) {
        const toggleHtml = `<label class="cell-toggle" title="Click to toggle">
          <span class="toggle">
            <input type="checkbox" id="inp_${file.id}_${row.key}" ${value === 'true' ? 'checked' : ''}
              onchange="onCellChange('${file.id}','${row.key}',this)">
            <span class="toggle-slider"></span>
          </span>
          <span class="toggle-val" id="lbl_${file.id}_${row.key}">${value}</span>
        </label>`;
        cellHtml = applyBtn
          ? `<div class="cell-with-actions">${toggleHtml}${applyBtn}</div>`
          : toggleHtml;
      } else {
        const inputHtml = `<input class="cell-input" id="inp_${file.id}_${row.key}"
          value="${escHtml(value)}" spellcheck="false"
          oninput="onCellChange('${file.id}','${row.key}',this)">`;
        // Sur une ligne « Comment », un petit bouton ↦ pour renommer le
        // fichier avec la valeur du commentaire courant.
        if (isCommentKey(row.key)) {
          // Icône « copy » (feather-icons style) — deux rectangles superposés,
          // convention universelle pour recopier vers un autre endroit.
          const copySvg = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
          cellHtml = `<div class="cell-with-rename">${inputHtml}<button type="button" class="btn-rename-to-comment" title="Rename this file to the Comment value (.set extension is added automatically)" onclick="renameFileToComment('${file.id}','${row.key}')">${copySvg}</button></div>`;
        } else if (applyBtn) {
          cellHtml = `<div class="cell-with-actions">${inputHtml}${applyBtn}</div>`;
        } else {
          cellHtml = inputHtml;
        }
      }
      td.innerHTML = `<div class="row-anim"><div class="row-anim-inner">${cellHtml}</div></div>`;

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });

  updateDiffHighlight();
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ── DIFF HIGHLIGHT ────────────────────────────────────────
function updateDiffHighlight() {
  let diffRows = 0;
  document.querySelectorAll('.param-row').forEach(tr => {
    const key = tr.dataset.key;
    const cells = tr.querySelectorAll('.value-cell');
    const values = [];
    cells.forEach(td => {
      const inp = td.querySelector('input[type=checkbox]');
      if (inp) { values.push(String(inp.checked)); return; }
      const sel = td.querySelector('select.cell-select');
      if (sel) { values.push(sel.value); return; }
      const txt = td.querySelector('input.cell-input');
      values.push(txt ? txt.value : '');
    });
    const allSame = values.length > 1 && values.every(v => v === values[0]);
    if (!allSame && values.length > 1) diffRows++;

    cells.forEach((td, i) => {
      if (!td.classList.contains('modified-cell')) {
        td.classList.toggle('diff-cell', !allSame && values.length > 1);
      }
    });
    tr.dataset.hasDiff = (!allSame && values.length > 1) ? '1' : '0';
  });

  const el = document.getElementById('diff-count');
  el.textContent = diffRows > 0 ? `(${diffRows})` : '';
  return diffRows;
}

// ── CELL CHANGE ───────────────────────────────────────────
function onCellChange(fileId, key, el) {
  const file = files.find(f => f.id === fileId);
  if (!file) return;

  // Update label for boolean
  const lbl = document.getElementById(`lbl_${fileId}_${key}`);
  if (lbl) lbl.textContent = el.checked ? 'true' : 'false';

  const inputEl = document.getElementById(`inp_${fileId}_${key}`);
  if (inputEl) inputEl.classList.add('modified');

  const td = inputEl?.closest('td') || el.closest('td');
  if (td) { td.classList.remove('diff-cell'); td.classList.add('modified-cell'); }

  file.changes.add(key);
  totalChanges++;

  const ccEl = document.getElementById(`cc_${fileId}`);
  if (ccEl) {
    ccEl.textContent = `${file.changes.size} change${file.changes.size !== 1 ? 's' : ''}`;
    ccEl.style.display = 'inline';
  }

  updateChangesBadge();
  updateDiffHighlight();
}

function updateChangesBadge() {
  const total = files.reduce((s, f) => s + f.changes.size, 0);
  const el = document.getElementById('changes-badge');
  if (total > 0) {
    el.textContent = `${total} change${total !== 1 ? 's' : ''}`;
    el.style.display = 'inline';
  } else {
    el.style.display = 'none';
  }
}

// ── FILTERS ───────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const anyFilter = q || diffOnly;
  let visibleDiff = 0;

  // Suppress transitions: rows appear/disappear instantly during filtering
  document.body.classList.add('no-anim');

  document.querySelectorAll('.param-row').forEach(tr => {
    const key = tr.dataset.key || '';
    const matchSearch = !q || key.includes(q);
    const matchDiff = !diffOnly || tr.dataset.hasDiff === '1';
    const show = matchSearch && matchDiff;
    tr.classList.toggle('hidden', !show);
    if (show && tr.dataset.hasDiff === '1') visibleDiff++;

    // Override section-collapse for matching rows so they're visible even if
    // their section is folded
    if (anyFilter && show) tr.classList.remove('section-collapsed');
  });

  // Breakers = décoratifs, sans intérêt hors du contexte plein — cachés
  // dès qu'un filtre est actif pour ne pas laisser traîner des bandeaux
  // isolés entre des lignes qui n'ont plus de rapport.
  document.querySelectorAll('tr.breaker-row').forEach(tr => {
    tr.classList.toggle('hidden', !!anyFilter);
  });

  // When all filters are cleared, restore the folded state of collapsed sections
  if (!anyFilter) {
    document.querySelectorAll('tr.section-row').forEach(sectionTr => {
      if (!collapsedSections.has(sectionTr.dataset.section)) return;
      let next = sectionTr.nextElementSibling;
      while (next && !next.classList.contains('section-row')) {
        next.classList.add('section-collapsed');
        next = next.nextElementSibling;
      }
    });
  }

  requestAnimationFrame(() => document.body.classList.remove('no-anim'));

  document.getElementById('no-diff').style.display =
    diffOnly && visibleDiff === 0 ? 'block' : 'none';
}


function toggleDiffOnly() {
  diffOnly = !diffOnly;
  document.getElementById('diff-btn').classList.toggle('active', diffOnly);
  applyFilters();
}

// ── RENAME FILE ───────────────────────────────────────────
function startRename(id) {
  const span = document.getElementById(`fn_${id}`);
  if (!span || span.querySelector('textarea')) return;
  const file = files.find(f => f.id === id);
  if (!file) return;

  const displayName = stripSetExt(file.name);
  const input = document.createElement('textarea');
  input.className = 'th-filename-input';
  input.value = displayName;
  input.onclick = e => e.stopPropagation();
  input.onblur = () => commitRename(id, input.value);
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = displayName; input.blur(); }
  };

  span.textContent = '';
  span.appendChild(input);
  input.focus();
  input.select();
}

function commitRename(id, newName) {
  const file = files.find(f => f.id === id);
  if (!file) return;
  const trimmed = newName.trim();
  const base = trimmed || stripSetExt(file.name);
  // On garde .set forcément — l'utilisateur peut avoir tapé ou non l'extension,
  // on la normalise pour que tous les exports sortent bien un fichier .set.
  const name = /\.set$/i.test(base) ? base : base + '.set';
  file.name = name;

  const span = document.getElementById(`fn_${id}`);
  if (span) {
    span.textContent = stripSetExt(name);
    span.title = name;
  }
}

// Renomme le fichier en reprenant la valeur courante du champ Comment.
// Lit la valeur au DOM (donc modifiée par l'utilisateur avant même flush).
// Caractères interdits en nom de fichier remplacés par « _ ».
function renameFileToComment(fileId, key) {
  const input = document.getElementById(`inp_${fileId}_${key}`);
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) return;
  const safe = raw.replace(/[\\/:*?"<>|]/g, '_').trim();
  if (!safe) return;
  commitRename(fileId, safe);
}

// v7.0 : bouton ⇉ — recopie la valeur courante de la cellule source vers
// tous les autres fichiers chargés pour la même clé. Lit et écrit au DOM
// (pas à paramMap) pour capter les édits non flush du fichier source et
// fait remonter la modification via onCellChange sur chaque cible (badge
// « N changes » + surbrillance « modified » comme lors d'une édition
// manuelle).
function applyValueToAllFiles(fileId, key) {
  const source = document.getElementById(`inp_${fileId}_${key}`);
  if (!source) return;
  const isCheckbox = source.type === 'checkbox';
  const value = isCheckbox ? source.checked : source.value;
  files.forEach(f => {
    if (!f || f.id === fileId) return;
    const target = document.getElementById(`inp_${f.id}_${key}`);
    if (!target) return;
    if (isCheckbox) {
      if (target.checked === value) return;
      target.checked = value;
    } else {
      if (target.value === value) return;
      target.value = value;
    }
    onCellChange(f.id, key, target);
  });
}

// HTML du bouton — jamais rendu quand un seul fichier est chargé.
// Icône double chevron (SVG stroke) plutôt qu'un caractère Unicode : rendu
// net à toutes les tailles, indépendant du navigateur/OS.
function applyAllBtnHtml(fileId, key) {
  if (files.length < 2) return '';
  const svg = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>`;
  return `<button type="button" class="btn-apply-all" title="Apply this value to all other loaded files" onclick="applyValueToAllFiles('${fileId}','${key}')">${svg}</button>`;
}

// ── FORMAT TO LATEST UBS ──────────────────────────────────
// Réémet le contenu d'un fichier chargé au format UBS_TEMPLATE_LATEST :
// ordre + section headers du gabarit, valeur du fichier chargé si la clé
// existe (lue au DOM pour capter les édits en cours, sinon depuis paramMap),
// sinon valeur de repli du gabarit. Les clés absentes du gabarit sont
// silencieusement retirées — c'est le but du reformatage.
function formatFileToLatestUBS(fileId) {
  const file = files.find(f => f.id === fileId);
  if (!file) return;

  const current = {};
  for (const key of Object.keys(file.paramMap)) {
    const inp = document.getElementById(`inp_${file.id}_${key}`);
    if (inp) {
      current[key] = inp.type === 'checkbox' ? (inp.checked ? 'true' : 'false') : inp.value;
    } else {
      current[key] = file.paramMap[key].value;
    }
  }

  const outLines = UBS_TEMPLATE_LATEST.split(/\r?\n/).map(line => {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith(';')) return line;
    const eq = trimmed.indexOf('=');
    if (eq === -1) return line;
    const key = trimmed.slice(0, eq).trim();
    const templateValue = trimmed.slice(eq + 1);
    const value = (key in current) ? current[key] : templateValue;
    return `${key}=${value}`;
  });

  const newContent = outLines.join('\r\n');
  file.parsed = parseSetFile(newContent);
  file.paramMap = buildParamMap(file.parsed);
  file.changes = new Set();
  file.reformatted = true;

  rebuildAll();
}

function formatAllToLatestUBS() {
  if (files.length === 0) return;
  files.forEach(f => {
    if (!f) return;
    const current = {};
    for (const key of Object.keys(f.paramMap)) {
      const inp = document.getElementById(`inp_${f.id}_${key}`);
      if (inp) {
        current[key] = inp.type === 'checkbox' ? (inp.checked ? 'true' : 'false') : inp.value;
      } else {
        current[key] = f.paramMap[key].value;
      }
    }
    const outLines = UBS_TEMPLATE_LATEST.split(/\r?\n/).map(line => {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith(';')) return line;
      const eq = trimmed.indexOf('=');
      if (eq === -1) return line;
      const key = trimmed.slice(0, eq).trim();
      const templateValue = trimmed.slice(eq + 1);
      const value = (key in current) ? current[key] : templateValue;
      return `${key}=${value}`;
    });
    f.parsed = parseSetFile(outLines.join('\r\n'));
    f.paramMap = buildParamMap(f.parsed);
    f.changes = new Set();
    f.reformatted = true;
  });
  rebuildAll();
}

// ── RESET ALL ─────────────────────────────────────────────
function resetAll() {
  files.length = 0;
  loadingNames.clear();
  document.getElementById('table-wrap').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('recap-panel').style.display = 'none';
  document.getElementById('dropzone').style.display = 'flex';
  document.getElementById('save-all-btn').disabled = true;
  document.getElementById('format-all-btn').disabled = true;
  document.getElementById('reset-btn').style.display = 'none';
  document.getElementById('changes-badge').style.display = 'none';
  collapsedSections.clear();
  lastBatchSnapshot = null;
}

// ── REMOVE FILE ───────────────────────────────────────────
function removeFile(id) {
  const idx = files.findIndex(f => f.id === id);
  if (idx === -1) return;
  files.splice(idx, 1);
  if (files.length === 0) {
    document.getElementById('table-wrap').style.display = 'none';
    document.getElementById('toolbar').style.display = 'none';
    document.getElementById('recap-panel').style.display = 'none';
    document.getElementById('dropzone').style.display = 'flex';
    document.getElementById('save-all-btn').disabled = true;
    document.getElementById('format-all-btn').disabled = true;
    document.getElementById('changes-badge').style.display = 'none';
    lastBatchSnapshot = null;
  } else {
    rebuildAll();
  }
}

// ── SAVE ─────────────────────────────────────────────────
function collectFileContent(file) {
  const written = new Set();
  return file.parsed.map(line => {
    if (line.type === 'param') {
      const inp = document.getElementById(`inp_${file.id}_${line.key}`);
      if (!inp) return line.raw;
      const val = inp.type === 'checkbox' ? (inp.checked ? 'true' : 'false') : inp.value;
      return `${line.key}=${val}||${line.def}||${line.mn}||${line.mx}||${line.opt ? 'Y' : 'N'}`;
    }
    if (line.type === 'simple') {
      if (written.has(line.key)) return line.raw;
      const inp = document.getElementById(`inp_${file.id}_${line.key}`);
      if (!inp) return line.raw;
      written.add(line.key);
      const val = inp.type === 'checkbox' ? (inp.checked ? 'true' : 'false') : inp.value;

      // v7.0 fix : quand un paramètre énuméré vient d'un fichier chargé en
      // format compact, on le ré-émet en format « test settings » avec
      // métadonnée pour que MT5 le reconnaisse comme un choix d'enum
      // valide plutôt que blanchir le champ. Bornes tirées de
      // PARAM_ENUM_MT5_MAX (observations sur .set sauvegardés par MT5).
      const enumDef = paramEnumFor(line.key);
      if (enumDef) {
        const keys = Object.keys(enumDef).map(Number).filter(n => Number.isFinite(n));
        const knownMax = PARAM_ENUM_MT5_MAX[line.key];
        const min = keys.length ? Math.min(...keys) : 0;
        const max = knownMax !== undefined ? knownMax : (keys.length ? Math.max(...keys) : 0);
        return `${line.key}=${val}||${val}||${min}||${max}||N`;
      }

      return `${line.key}=${val}`;
    }
    return line.raw;
  }).join('\r\n');
}


// ── UTF-16 LE ENCODER ────────────────────────────────────
function buildFileBytes(text) {
  const bom = new Uint8Array([0xFF, 0xFE]);
  const utf16 = new Uint8Array(text.length * 2);
  for (let i = 0; i < text.length; i++) {
    const c = text.charCodeAt(i);
    utf16[i * 2]     = c & 0xFF;
    utf16[i * 2 + 1] = (c >> 8) & 0xFF;
  }
  const buf = new Uint8Array(bom.length + utf16.length);
  buf.set(bom); buf.set(utf16, bom.length);
  return buf;
}

function downloadAsUtf16(filename, text) {
  const blob = new Blob([buildFileBytes(text)], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function setFilename(name) {
  return name.replace(/\.[^.]+$/, '') + '.set';
}

function saveFile(id) {
  const file = files.find(f => f.id === id);
  if (!file) return;
  downloadAsUtf16(file.name, collectFileContent(file));
  file.changes.clear();
  file.reformatted = false;
  const cc = document.getElementById(`cc_${id}`);
  if (cc) cc.style.display = 'none';
  updateChangesBadge();
  if (file.parsed) rebuildAll();
}

// ── ZIP WRITER ────────────────────────────────────────────
(function () {
  const _t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let j = 0; j < 8; j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    _t[i] = c;
  }
  window._crc32 = bytes => {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = _t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
})();

function buildZip(entries) {
  // entries: [{name: string, data: Uint8Array}]
  const enc = new TextEncoder();
  const w16 = (v, o, n) => v.setUint16(o, n, true);
  const w32 = (v, o, n) => v.setUint32(o, n, true);

  const now  = new Date();
  const time = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1));
  const date = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate());

  const locals = [];
  let offset = 0;

  for (const { name, data } of entries) {
    const nb  = enc.encode(name);
    const crc = window._crc32(data);
    const lh  = new Uint8Array(30 + nb.length);
    const lv  = new DataView(lh.buffer);
    lh[0]=0x50; lh[1]=0x4B; lh[2]=0x03; lh[3]=0x04;
    w16(lv, 4, 20); w16(lv, 6, 0); w16(lv, 8, 0);
    w16(lv, 10, time); w16(lv, 12, date);
    w32(lv, 14, crc); w32(lv, 18, data.length); w32(lv, 22, data.length);
    w16(lv, 26, nb.length); w16(lv, 28, 0);
    lh.set(nb, 30);
    locals.push({ lh, data, crc, nb, offset });
    offset += lh.length + data.length;
  }

  const cds = locals.map(e => {
    const cd = new Uint8Array(46 + e.nb.length);
    const cv = new DataView(cd.buffer);
    cd[0]=0x50; cd[1]=0x4B; cd[2]=0x01; cd[3]=0x02;
    w16(cv, 4, 20); w16(cv, 6, 20); w16(cv, 8, 0); w16(cv, 10, 0);
    w16(cv, 12, e.lh[10] | (e.lh[11] << 8)); // time (already LE)
    w16(cv, 14, e.lh[12] | (e.lh[13] << 8)); // date
    w32(cv, 16, e.crc); w32(cv, 20, e.data.length); w32(cv, 24, e.data.length);
    w16(cv, 28, e.nb.length); w16(cv, 30, 0); w16(cv, 32, 0);
    w16(cv, 34, 0); w16(cv, 36, 0); w32(cv, 38, 0); w32(cv, 42, e.offset);
    cd.set(e.nb, 46);
    return cd;
  });

  const cdSize = cds.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  eocd[0]=0x50; eocd[1]=0x4B; eocd[2]=0x05; eocd[3]=0x06;
  w16(ev, 4, 0); w16(ev, 6, 0);
  w16(ev, 8, locals.length); w16(ev, 10, locals.length);
  w32(ev, 12, cdSize); w32(ev, 16, offset); w16(ev, 20, 0);

  const out = new Uint8Array(offset + cdSize + 22);
  let pos = 0;
  locals.forEach(e => { out.set(e.lh, pos); pos += e.lh.length; out.set(e.data, pos); pos += e.data.length; });
  cds.forEach(c => { out.set(c, pos); pos += c.length; });
  out.set(eocd, pos);
  return out;
}

function saveAll() {
  if (files.length === 1) { saveFile(files[0].id); return; }

  const entries = files.map(f => ({ name: f.name, data: buildFileBytes(collectFileContent(f)) }));
  const zip     = buildZip(entries);
  const blob    = new Blob([zip], { type: 'application/zip' });
  const a       = document.createElement('a');
  a.href        = URL.createObjectURL(blob);
  a.download    = 'setfiles.zip';
  a.click();
  URL.revokeObjectURL(a.href);

  // mark all files as saved
  files.forEach(f => {
    f.changes.clear();
    f.reformatted = false;
    const cc = document.getElementById(`cc_${f.id}`);
    if (cc) cc.style.display = 'none';
  });
  updateChangesBadge();
  rebuildAll();
}

// ── DRAG & DROP ───────────────────────────────────────────
// Handlers en phase de CAPTURE sur document : interceptent le drag/drop
// de fichiers AVANT que n'importe quel input du tableau ne puisse les
// avaler. Sans ça, une fois la dropzone masquée après le premier import,
// les drops suivants tombaient sur les <input class="cell-input"> des
// cellules et disparaissaient silencieusement (impossible d'ajouter un
// deuxième .set par drag après le premier).

function hasFileDrag(e) {
  const t = e.dataTransfer && e.dataTransfer.types;
  if (!t) return false;
  // DataTransferItemList : .includes n'existe pas partout, on itère.
  for (let i = 0; i < t.length; i++) if (t[i] === 'Files') return true;
  return false;
}

document.addEventListener('dragover', e => {
  if (!hasFileDrag(e)) return;
  e.preventDefault();
  const dz = document.getElementById('dropzone');
  if (dz && dz.offsetParent !== null) dz.classList.add('drag-over');
}, true);

document.addEventListener('dragleave', e => {
  // Quitter réellement la fenêtre : relatedTarget null sur beaucoup de
  // browsers, position 0/0 en secours pour Firefox.
  if (e.relatedTarget) return;
  const dz = document.getElementById('dropzone');
  if (dz) dz.classList.remove('drag-over');
}, true);

document.addEventListener('drop', e => {
  if (!hasFileDrag(e)) return;
  e.preventDefault();
  e.stopPropagation();
  const dz = document.getElementById('dropzone');
  if (dz) dz.classList.remove('drag-over');
  const setFiles = Array.from(e.dataTransfer.files).filter(f =>
    f.name.toLowerCase().endsWith('.set')
  );
  if (setFiles.length === 0) return;
  const dt = new DataTransfer();
  setFiles.forEach(f => dt.items.add(f));
  const input = document.getElementById('file-input');
  input.files = dt.files;
  addFiles(input);
}, true);

// ── BATCH PATCH ───────────────────────────────────────────
let lastBatchSnapshot = null;

function updateParamDatalist() {
  const dl = document.getElementById('batch-param-list');
  // v7.0 : la barre Batch Edit est commentée — skip proprement
  // pour ne pas casser rebuildAll() qui nous appelle systématiquement.
  if (!dl) return;
  dl.innerHTML = '';
  const allKeys = new Set();
  files.forEach(f => Object.keys(f.paramMap).forEach(k => allKeys.add(k)));
  [...allKeys].sort().forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    dl.appendChild(opt);
  });
}

function onBatchParamInput() {
  const name    = document.getElementById('batch-param').value.trim();
  const valueEl = document.getElementById('batch-value');
  const boolEl  = document.getElementById('batch-value-bool');
  const enumEl  = document.getElementById('batch-value-enum');
  // Priorité : énumération > booléen > texte libre. Pas de conflit entre
  // enum et bool : les paramètres énumérés (Run_Strategy, Risk…) ne sont
  // jamais aussi booléens. Détection par paramEnumFor() — même mécanisme
  // que celui utilisé par buildBody() pour les cellules.
  const enumDef = paramEnumFor(name);
  const isEnum  = !!enumDef;
  const isBool  = !isEnum && files.some(f => f.paramMap[name]?.isBoolean);

  if (isEnum) {
    const currentVal = (files.find(f => f.paramMap[name])?.paramMap[name]?.value ?? '').trim();
    enumEl.innerHTML = Object.entries(enumDef).map(([v, label]) => {
      const selected = String(v) === currentVal ? ' selected' : '';
      return `<option value="${v}"${selected}>${label.replace(/</g,'&lt;')}</option>`;
    }).join('');
  }

  valueEl.style.display = (!isEnum && !isBool) ? 'block' : 'none';
  boolEl.style.display  = isBool ? 'block' : 'none';
  enumEl.style.display  = isEnum ? 'block' : 'none';
}

function getBatchValue() {
  const enumEl = document.getElementById('batch-value-enum');
  if (enumEl.style.display !== 'none') return enumEl.value;
  const boolEl = document.getElementById('batch-value-bool');
  if (boolEl.style.display !== 'none') return boolEl.value;
  return document.getElementById('batch-value').value.trim();
}

function batchApply(forceDryRun) {
  const paramName = document.getElementById('batch-param').value.trim();
  const newValue  = getBatchValue();
  const dryRun    = forceDryRun || document.getElementById('batch-dryrun').checked;
  if (!paramName || newValue === '') return;

  const results  = [];
  const snapshot = [];
  let modifiedCount = 0;

  files.forEach(file => {
    const paramLine = file.paramMap[paramName];
    const inp = document.getElementById(`inp_${file.id}_${paramName}`);
    if (!paramLine && !inp) {
      results.push({ file, status: 'absent' });
      return;
    }
    const currentValue = inp
      ? (inp.type === 'checkbox' ? (inp.checked ? 'true' : 'false') : inp.value)
      : String(paramLine.value);

    if (currentValue === newValue) {
      results.push({ file, status: 'same', oldValue: currentValue });
      return;
    }

    results.push({ file, status: 'modified', oldValue: currentValue });
    modifiedCount++;

    if (!dryRun && inp) {
      snapshot.push({ fileId: file.id, param: paramName, oldValue: currentValue, isCheckbox: inp.type === 'checkbox' });
      if (inp.type === 'checkbox') {
        inp.checked = newValue === 'true';
      } else {
        inp.value = newValue;
      }
      onCellChange(file.id, paramName, inp);
    }
  });

  lastBatchSnapshot = (!dryRun && modifiedCount > 0)
    ? { param: paramName, newValue, changes: snapshot }
    : null;

  showRecap(paramName, newValue, results, modifiedCount, dryRun);
}

function showRecap(param, newValue, results, modifiedCount, dryRun) {
  const panel   = document.getElementById('recap-panel');
  const summary = document.getElementById('recap-summary');
  const undoBtn = document.getElementById('recap-undo-btn');
  const rowsEl  = document.getElementById('recap-rows');
  const total   = results.length;

  if (dryRun) {
    summary.className   = 'dry';
    summary.textContent = `[DRY-RUN]  ${param} → "${newValue}"  —  ${modifiedCount}/${total} file(s) would be modified`;
  } else if (modifiedCount > 0) {
    summary.className   = 'ok';
    summary.textContent = `✓  ${param} → "${newValue}"  —  ${modifiedCount}/${total} file(s) modified`;
  } else {
    summary.className   = 'warn';
    summary.textContent = `${param}  —  no changes (absent or already "${newValue}")`;
  }

  undoBtn.style.display = (!dryRun && modifiedCount > 0) ? 'inline-block' : 'none';

  rowsEl.innerHTML = '';
  results.forEach(r => {
    const div = document.createElement('div');
    div.className = 'recap-row ' + (r.status === 'modified' ? 'modified' : 'skipped');

    let changeHtml;
    if (r.status === 'modified') {
      changeHtml = `<span class="rr-old">${escHtml(r.oldValue)}</span>
                    <span class="rr-arr">→</span>
                    <span class="rr-new">${escHtml(newValue)}</span>`;
    } else if (r.status === 'absent') {
      changeHtml = `<span class="rr-skip">parameter not found</span>`;
    } else {
      changeHtml = `<span class="rr-skip">already "${escHtml(r.oldValue)}"</span>`;
    }

    const icon = r.status === 'modified' ? (dryRun ? '◎' : '✓')
               : r.status === 'absent'   ? '–' : '=';

    div.innerHTML = `<span class="rr-icon">${icon}</span>
                     <span class="rr-file">${escHtml(r.file.name)}</span>
                     <span class="rr-change">${changeHtml}</span>`;
    rowsEl.appendChild(div);
  });

  panel.style.display = 'block';
}

function undoBatch() {
  if (!lastBatchSnapshot) return;
  lastBatchSnapshot.changes.forEach(({ fileId, param, oldValue, isCheckbox }) => {
    const inp = document.getElementById(`inp_${fileId}_${param}`);
    if (!inp) return;
    if (isCheckbox) { inp.checked = oldValue === 'true'; }
    else            { inp.value = oldValue; }
    onCellChange(fileId, param, inp);
  });
  lastBatchSnapshot = null;
  closeRecap();
}

function closeRecap() {
  document.getElementById('recap-panel').style.display = 'none';
}

// ── THEME ─────────────────────────────────────────────────
const SUN_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const MOON_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('seteditor-theme', theme);
  const btn = document.getElementById('theme-btn');
  if (btn) {
    if (theme === 'dark') {
      btn.innerHTML = SUN_SVG;
      btn.title = 'Switch to light theme';
    } else {
      btn.innerHTML = MOON_SVG;
      btn.title = 'Switch to dark theme';
    }
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

// Initialise au chargement (dark par défaut)
const _saved  = localStorage.getItem('seteditor-theme');
const _system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
applyTheme(_saved || _system);
</script>
